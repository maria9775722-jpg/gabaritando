<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Correção de Gabarito</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .info-fields {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .field-group {
      flex: 1;
      min-width: 200px;
    }

    .field-group label {
      display: block;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 5px;
      color: #2c3e50;
    }

    .field-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .subject-block {
      margin-bottom: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      background-color: #fafafa;
    }

    .subject-title {
      color: #2980b9;
      margin-bottom: 12px;
      font-size: 1.1rem;
      border-bottom: 2px solid #2980b9;
      padding-bottom: 4px;
    }

    .questions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .question-item {
      display: flex;
      flex-direction: column;
      background: #fff;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .question-item label {
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #555;
    }

    .inputs-row {
      display: flex;
      gap: 4px;
    }

    select {
      width: 100%;
      padding: 4px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 0.85rem;
      background-color: #fff;
    }

    button#btn-correct {
      display: block;
      width: 100%;
      padding: 15px;
      background-color: #27ae60;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: background-color 0.2s;
    }

    button#btn-correct:hover {
      background-color: #219150;
    }

    .result-card {
      margin-top: 30px;
      padding: 20px;
      background-color: #eef9f1;
      border: 1px solid #c3e6cb;
      border-radius: 8px;
    }

    .hidden {
      display: none;
    }

    .student-detail {
      text-align: center;
      font-size: 1.1rem;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .score-summary {
      font-size: 1.5rem;
      font-weight: bold;
      color: #155724;
      margin-bottom: 20px;
      text-align: center;
    }

    .subject-result {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #c3e6cb;
      font-size: 0.95rem;
    }

    .subject-result:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Correção de Gabarito (65 Questões)</h1>
    <p class="subtitle">Insira os dados do aluno, o gabarito oficial e as respostas para realizar a correção.</p>

    <div class="info-fields">
      <div class="field-group">
        <label for="student-name">Nome do Aluno:</label>
        <input type="text" id="student-name" placeholder="Ex: João Silva">
      </div>
      <div class="field-group">
        <label for="student-class">Turma / Turno:</label>
        <input type="text" id="student-class" placeholder="Ex: 3º Ano A">
      </div>
    </div>

    <div id="subjects-container"></div>

    <button id="btn-correct" onclick="corrigirGabarito()">Corrigir Prova</button>

    <div id="result" class="result-card hidden">
      <h2>Resultado da Correção</h2>
      <div id="student-info-display" class="student-detail"></div>
      <div id="score-summary" class="score-summary"></div>
      <h3>Desempenho por Matéria</h3>
      <div id="subject-breakdown"></div>
    </div>
  </div>

  <script>
    const materias = [
      { nome: "Português", inicio: 1, fim: 5 },
      { nome: "Inglês", inicio: 6, fim: 10 },
      { nome: "Educação Física", inicio: 11, fim: 15 },
      { nome: "Artes", inicio: 16, fim: 20 },
      { nome: "Matemática", inicio: 21, fim: 25 },
      { nome: "Biologia", inicio: 26, fim: 30 },
      { nome: "Física", inicio: 31, fim: 35 },
      { nome: "Química", inicio: 36, fim: 40 },
      { nome: "História", inicio: 41, fim: 45 },
      { nome: "Geografia", inicio: 46, fim: 50 },
      { nome: "Sociologia", inicio: 51, fim: 55 },
      { nome: "Filosofia", inicio: 56, fim: 60 },
      { nome: "Informática", inicio: 61, fim: 65 }
    ];

    const opcoes = ["A", "B", "C", "D", "E"];

    function inicializarFormulario() {
      const container = document.getElementById("subjects-container");

      materias.forEach(materia => {
        const block = document.createElement("div");
        block.className = "subject-block";

        const title = document.createElement("h3");
        title.className = "subject-title";
        title.innerText = `${materia.nome} (Questões ${materia.inicio} a ${materia.fim})`;
        block.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "questions-grid";

        for (let i = materia.inicio; i <= materia.fim; i++) {
          const qItem = document.createElement("div");
          qItem.className = "question-item";

          qItem.innerHTML = `
            <label>Q${i}</label>
            <div class="inputs-row">
              <select id="gab-${i}" title="Gabarito Q${i}">
                <option value="">Gab</option>
                ${opcoes.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
              </select>
              <select id="resp-${i}" title="Resposta Aluno Q${i}">
                <option value="">Aluno</option>
                ${opcoes.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
              </select>
            </div>
          `;
          grid.appendChild(qItem);
        }

        block.appendChild(grid);
        container.appendChild(block);
      });
    }

    function corrigirGabarito() {
      let acertosTotais = 0;
      const resultadosPorMateria = [];

      const nomeAluno = document.getElementById("student-name").value.trim() || "Aluno sem nome";
      const turmaAluno = document.getElementById("student-class").value.trim();

      materias.forEach(materia => {
        let acertosMateria = 0;
        let totalMateria = materia.fim - materia.inicio + 1;

        for (let i = materia.inicio; i <= materia.fim; i++) {
          const gabarito = document.getElementById(`gab-${i}`).value;
          const resposta = document.getElementById(`resp-${i}`).value;

          if (gabarito && resposta && gabarito === resposta) {
            acertosMateria++;
            acertosTotais++;
          }
        }

        resultadosPorMateria.push({
          nome: materia.nome,
          acertos: acertosMateria,
          total: totalMateria
        });
      });

      const resultDiv = document.getElementById("result");
      const studentInfoDiv = document.getElementById("student-info-display");
      const summaryDiv = document.getElementById("score-summary");
      const breakdownDiv = document.getElementById("subject-breakdown");

      studentInfoDiv.innerText = `${nomeAluno}${turmaAluno ? ' - ' + turmaAluno : ''}`;
      
      const percentual = ((acertosTotais / 65) * 100).toFixed(1);
      summaryDiv.innerText = `Pontuação Total: ${acertosTotais} / 65 acertos (${percentual}%)`;

      breakdownDiv.innerHTML = "";
      resultadosPorMateria.forEach(res => {
        const item = document.createElement("div");
        item.className = "subject-result";
        item.innerHTML = `
          <span><strong>${res.nome}:</strong></span> 
          <span>${res.acertos} de ${res.total} acertos (${((res.acertos/res.total)*100).toFixed(0)}%)</span>
        `;
        breakdownDiv.appendChild(item);
      });

      resultDiv.classList.remove("hidden");
      resultDiv.scrollIntoView({ behavior: 'smooth' });
    }

    document.addEventListener("DOMContentLoaded", inicializarFormulario);
  </script>
</body>
</html>
